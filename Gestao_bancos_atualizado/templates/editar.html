<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Integração</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; border-left: 4px solid #ff9800; }
        input, textarea { width: 100%; margin-bottom: 10px; background: #333; color: white; border: 1px solid #555; padding: 8px; box-sizing: border-box; }
        button { background: #ff9800; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <h2>✏️ Editar Integração: {{ registro['nome_banco'] }}</h2>
        <p style="color: #aaa; font-size: 14px;">Registro de: {{ registro['data_integracao'][8:10] }}/{{ registro['data_integracao'][5:7] }}/{{ registro['data_integracao'][0:4] }}</p>
        
        <form action="/editar/{{ registro['id'] }}" method="POST">
            <label>Adicionar/Alterar Descrição:</label>
            <textarea name="descricao" rows="4">{{ registro['descricao'] }}</textarea>

            <label style="display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" id="deu_erro" name="deu_erro" onclick="mostrarMotivo()" style="width: auto; margin: 0;" {% if registro['deu_erro'] == 'Sim' %}checked{% endif %}>
                Houve erro na integração?
            </label>

            <div id="div_motivo" style="display: {% if registro['deu_erro'] == 'Sim' %}block{% else %}none{% endif %}; margin-top: 15px;">
                <label>Motivo do Erro:</label>
                <input type="text" id="motivo_erro" name="motivo_erro" value="{{ registro['motivo_erro'] if registro['motivo_erro'] != '-' else '' }}">
            </div>

            <button type="submit" style="margin-top: 20px;">Salvar Alterações</button>
        </form>
        <br>
        <a href="/relatorios" style="color: #ccc; text-decoration: none;">Cancelar e Voltar</a>
    </div>

    <script>
        function mostrarMotivo() {
            var checkbox = document.getElementById("deu_erro");
            var divMotivo = document.getElementById("div_motivo");
            divMotivo.style.display = checkbox.checked ? "block" : "none";
        }
    </script>
</body>
</html>
